plugins {
    id "com.android.application"
}

android {
    namespace "com.example.a22cameralink"
    compileSdk 35

    defaultConfig {
        applicationId "com.example.a22cameralink"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation "io.github.webrtc-sdk:android:150.7871.01"
}